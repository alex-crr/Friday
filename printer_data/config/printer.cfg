[include mains/printer_core.cfg]
[include mains/kinematics.cfg]
[include mains/extruder.cfg]
[include mains/macros.cfg]
[include mains/bed_mesh.cfg]
[include mains/sensors.cfg]
[include mains/fans.cfg]
[include mains/toolchange.cfg]

[include mainsail.cfg]


[extruder]
step_pin = !PD5
dir_pin = PD6
enable_pin = !PB3
microsteps = 32
rotation_distance = 3.433
nozzle_diameter = 0.400
filament_diameter = 1.750
max_extrude_only_distance = 100.0
max_extrude_cross_section = 1.000
heater_pin = PB11
sensor_type = Generic 3950
sensor_pin = PA4
min_temp = -100
max_temp = 270
min_extrude_temp = 170
control = pid
pid_Kp=12.949 
pid_Ki=0.303 
pid_Kd=138.397

[tmc2209 extruder]
uart_pin = PD1
run_current = 0.8
stealthchop_threshold = 999999

[bltouch]
sensor_pin = PA6
control_pin = PA7
x_offset = 23
y_offset = -30
samples = 3
speed = 10
stow_on_each_sample = False
probe_with_touch_mode = True
#z_offset = 5.040

[heater_bed]
heater_pin = PB2
sensor_type = EPCOS 100K B57560G104F
sensor_pin = PA3
min_temp = -100
max_temp = 100
#control = pid
#pid_kp = 73.992
#pid_ki = 1.068
#pid_kd = 1281.913

